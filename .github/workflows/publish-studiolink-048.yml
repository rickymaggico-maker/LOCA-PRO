name: Publish StudioLink 0.4.8

on:
  push:
    paths:
      - '.github/workflows/publish-studiolink-048.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified StudioLink 0.4.8 build
        run: |
          curl -fL 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-2f08-820a-ba38-d29b588a1ddb/raw?se=2026-09-10T09%3A19%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=5b0d98c1-856a-552f-b15c-9fa159f82f3d&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T05%3A43%3A30Z&ske=2026-09-11T05%3A43%3A30Z&sks=b&skv=2026-02-06&sig=AAH2Jklv9Czx12%2BYchYUUSNEGNJfyYEzDmBQZ4SJ8q8%3D' -o StudioLink-0.4.8-build.zip
          unzip -o StudioLink-0.4.8-build.zip -d .studiolink048
          test -f .studiolink048/StudioLink.exe
          echo 'af408e6c13f0da4526cdd8aa0789c5e43e869daba6c56c21e174607caf4cd8c2  .studiolink048/StudioLink.exe' | sha256sum -c -
      - name: Publish binary
        run: |
          mkdir -p studiolink-updates
          cp .studiolink048/StudioLink.exe studiolink-updates/StudioLink-0.4.8.exe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studiolink-updates/StudioLink-0.4.8.exe
          git diff --cached --quiet || git commit -m 'Publish verified StudioLink 0.4.8 binary'
          git push
