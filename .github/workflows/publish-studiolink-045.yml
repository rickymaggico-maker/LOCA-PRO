name: Publish StudioLink 0.4.5

on:
  push:
    paths:
      - '.github/workflows/publish-studiolink-045.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified StudioLink 0.4.5 build
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6110-81f4-bb2e-7463ea521fc3/raw?se=2026-09-08T12%3A24%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=d5c1386b-7ffc-539c-9020-399e77e56c9b&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T06%3A13%3A01Z&ske=2026-09-09T06%3A13%3A01Z&sks=b&skv=2026-02-06&sig=Km0ZjFlz4F3L%2BoEDtz4Gbl9VYm7gQ7rYoKDUEXVGsOE%3D' -o StudioLink-0.4.5-build.zip
          unzip -o StudioLink-0.4.5-build.zip -d .studiolink045
          test -f .studiolink045/StudioLink.exe
          echo '7fc1480fc5669c5d2261ecf95bbb27e805369797f184b69259f0021092f80c24  .studiolink045/StudioLink.exe' | sha256sum -c -
      - name: Publish binary
        run: |
          mkdir -p studiolink-updates
          cp .studiolink045/StudioLink.exe studiolink-updates/StudioLink-0.4.5.exe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studiolink-updates/StudioLink-0.4.5.exe
          git diff --cached --quiet || git commit -m 'Publish verified StudioLink 0.4.5 binary'
          git push
